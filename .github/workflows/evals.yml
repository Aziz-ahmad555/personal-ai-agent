name: Evals

# Manual only — never on push. --live mode makes real Tavily/LLM calls (real cost);
# --replay is free and deterministic. See evals/run_all.py's own docstring.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Run in --live mode (real API calls, real cost — needs the secrets below set on this repo)"
        type: boolean
        default: false
      skip_retrieval:
        description: "Skip the profile/RAG retrieval bucket"
        type: boolean
        default: false

jobs:
  evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Not a real secret — this run never protects live user data, it only needs to pass
      # Settings' own validation (min_length=16). evals/db.py creates and drops its own
      # dedicated eval database on the service container above; nothing here touches a real
      # personal_agent database.
      APP_SECRET_KEY: "ci-eval-run-placeholder-key"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
      # Only populated if you've added these as repository secrets (Settings > Secrets and
      # variables > Actions) — required for --live, unused otherwise.
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: "groq"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run evals
        run: |
          python -m evals.run_all \
            ${{ inputs.live && '--live' || '' }} \
            ${{ inputs.skip_retrieval && '--skip-retrieval' || '' }}

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/
          retention-days: 30
