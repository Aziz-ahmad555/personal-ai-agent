# Render Blueprint for the backend — see https://render.com/docs/blueprint-spec
#
# Deploys the same codebase as the personal deployment, with demo_mode=true and a shared
# demo account. Render's free web-service tier sleeps after 15 minutes of inactivity (a
# cold start costs ~1 minute) — acceptable for a portfolio demo, not for the personal
# deployment. Postgres and Redis are NOT provisioned here on purpose: Render's free Postgres
# expires after 30 days, so this uses Neon (Postgres + pgvector, scales to zero, no expiry)
# and Upstash (Redis, free tier) instead — set DATABASE_URL and REDIS_URL below to those.
#
# background_scheduler_enabled is false here specifically: the demo's data is reset by
# scripts/seed_demo.py on an external GitHub Actions cron (.github/workflows/demo-reset.yml),
# not by this app's own APScheduler — the two would otherwise both be writing to the same rows
# on different schedules. daily_spend_cap_usd and max_tokens_per_task are set lower than this
# project's personal-deployment defaults (5.0 / 200_000 in app/config.py) because the demo's
# LLM-cost endpoints are rate-limited per-IP, not per-account — many anonymous visitors can
# each use their own 10/hour allowance in the same day, which a personal single-user deployment
# never has to account for.
#
# Creating the actual Render/Neon/Upstash accounts and setting real secret values is a manual,
# one-time step for whoever owns this deployment — see docs/deployment.md.

services:
  - type: web
    name: personal-ai-agent-demo
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: BACKGROUND_SCHEDULER_ENABLED
        value: "false"
      - key: DAILY_SPEND_CAP_USD
        value: "1"
      - key: MAX_TOKENS_PER_TASK
        value: "100000"
      - key: RESEARCH_MAX_SOURCES_PER_QUERY
        value: "4"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon direct (non-pooler) connection string, postgresql+asyncpg://...?ssl=require
      - key: REDIS_URL
        sync: false # Upstash connection string (prefer the TLS one: rediss://...)
      - key: CORS_ORIGINS
        sync: false # leave blank for now; set to the Vercel URL once the frontend is deployed
      - key: GROQ_API_KEY
        sync: false # powers every live LLM feature left enabled in the demo (default llm_provider)
      - key: TAVILY_API_KEY
        sync: false # powers the Research Engine's live web search
      - key: VOYAGE_API_KEY
        sync: false # powers embeddings for /search and the Research Engine
